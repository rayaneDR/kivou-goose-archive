name: Build Kivou 0.3 Windows draft
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GOOSE_DISABLE_TELEMETRY: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/creator/package-lock.json
      - name: Verify the selected preview and test source
        shell: pwsh
        run: |
          if ((Get-Content ui/creator/package.json -Raw | ConvertFrom-Json).version -ne '0.3.0') { throw 'This workflow is limited to the approved 0.3.0 preview.' }
          node --test creator/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Creator tests failed.' }
      - name: Prepare and verify the pinned Goose runtime
        shell: pwsh
        run: |
          . ./scripts/prepare-kivou-runtime.ps1
          $pins = Get-Content qa/runtime-pins.json -Raw | ConvertFrom-Json
          $actual = (Get-FileHash -LiteralPath ui/creator/.runtime/goose-v1.56.0-windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $pins.gooseArchiveSha256) { throw 'Pinned Goose runtime digest mismatch.' }
          "KIVOU_GOOSE_BINARY=$env:KIVOU_GOOSE_BINARY" >> $env:GITHUB_ENV
      - name: Install and build the focused application
        working-directory: ui/creator
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Focused build failed.' }
          npm run package:windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows package failed.' }
      - name: Check packaged library flows without a model or credentials
        working-directory: ui/creator
        shell: pwsh
        run: |
          $env:KIVOU_PACKAGED_EXE = (Resolve-Path out/v0.3.0/Kivou-win32-x64/Kivou.exe).Path
          $env:KIVOU_SMOKE_EVIDENCE = 'library-cloud-smoke.json'
          $env:KIVOU_SMOKE_CAPTURE_PREFIX = 'cloud-library'
          node scripts/library-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged local-flow smoke failed.' }
      - name: Build the single-file portable executable
        working-directory: ui/creator
        shell: pwsh
        run: |
          npx --yes electron-builder@26.18.0 --win portable --x64 --prepackaged out/v0.3.0/Kivou-win32-x64 --config electron-builder.portable.json --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Portable executable build failed.' }
      - name: Upload verified files to a draft only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'kivou-v0.3.0'
          $draft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft) { throw 'An existing draft is required; published versions are never overwritten.' }
          $exe = 'releases/portable-v0.3.0/Kivou.exe'
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Kivou.exe" | Set-Content -LiteralPath releases/SHA256SUMS-v0.3.0.txt -Encoding utf8NoBOM
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --notes-file docs/kivou/RELEASE-NOTES-v0.3.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft update failed.' }
          gh release upload $tag $exe releases/SHA256SUMS-v0.3.0.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed.' }
          Write-Output 'Draft assets uploaded. Local download and real-model verification are required before publication.'
