<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Kivou Island</title><link rel="stylesheet" href="island.css"></head><body><main class="island" id="island"><button class="island-handle" id="toggle" aria-expanded="false" aria-controls="expanded"><svg class="island-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 5v22M26 5 10 16l16 11M10 16h13" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="island-copy"><strong id="label">Kivou is here</strong><span id="subtitle">Your next idea, one click away</span></span><span class="state-light" id="light"></span><svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button><section id="expanded" hidden><header><span>Kivou · Windows</span><button id="collapse" aria-label="Collapse island">−</button></header><div class="island-state" aria-live="polite"><div class="large-mark" aria-hidden="true">k<span>.</span></div><h1 id="title">A good place to start.</h1><p id="progress">Bring an idea. Kivou keeps the conversation and helps you find your next step.</p></div><div class="island-result" id="result" hidden></div><form id="quick-form"><label for="quick-message" class="quick-label">Ask Kivou</label><textarea id="quick-message" rows="2" maxlength="4000" placeholder="A quick thought…"></textarea><label class="quick-consent"><input id="quick-consent" type="checkbox"> Send this note and earlier island notes to my model</label><p id="quick-error" role="alert" hidden></p><button id="quick-send" type="submit">Send note <span aria-hidden="true">↑</span></button></form><button class="workspace-action" id="open">Talk to Kivou <span aria-hidden="true">↗</span></button><button class="stop-action" id="stop" hidden>Stop current run</button><footer><span id="connection">Connect your model in the workspace</span><button id="hide">Hide island</button></footer></section></main><script src="island.js"></script></body></html>
